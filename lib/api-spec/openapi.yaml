openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact enquiries
paths:
  /media/farm-valuation.mp4:
    get:
      operationId: getFarmValuationVideo
      summary: Stream the public Farm Valuation Assessment video
      parameters:
        - in: header
          name: Range
          schema:
            type: string
          description: A single byte range for video seeking
      responses:
        "200":
          description: Complete video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Requested video byte range
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Video storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/soil-analysis.mp4:
    get:
      operationId: getSoilAnalysisVideo
      summary: Stream the public Soil Analysis video
      parameters:
        - in: header
          name: Range
          schema:
            type: string
          description: A single byte range for video seeking
      responses:
        "200":
          description: Complete video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Requested video byte range
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "416":
          description: Invalid or unsatisfiable byte range
        "503":
          description: Video storage temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact-enquiries:
    post:
      operationId: submitContactEnquiry
      tags: [contact]
      summary: Send a contact enquiry to VerdiSol Agro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEnquiryInput"
      responses:
        "200":
          description: Enquiry delivered to the configured recipient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEnquiryResponse"
        "400":
          description: Invalid enquiry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many enquiries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Email provider failed to deliver the enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactEnquiryInput:
      type: object
      required:
        - fullName
        - phone
        - location
        - service
        - message
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 5
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
        location:
          type: string
          minLength: 1
          maxLength: 200
        service:
          type: string
          enum:
            - Underground Water Surveys
            - Drone Surveying
            - Aerial Mapping
            - Land Use Planning
            - Farm Assessment & Valuation
            - Boundary Pegging
            - Agricultural Investment Consultancy
            - Soil Analysis
            - Crop Advisory
            - Irrigation Planning
            - Agricultural Engineering (Fencing)
        message:
          type: string
          minLength: 1
          maxLength: 5000
    ContactEnquiryResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

